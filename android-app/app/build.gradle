plugins {
    id 'com.android.application'
}

android {
    namespace 'com.notebase.student'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.notebase.student"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    flavorDimensions "portal"
    productFlavors {
        student {
            dimension "portal"
            applicationId "com.notebase.student"
            versionCode 2
            versionName "1.1.0"
            resValue "string", "app_name", "NoteBase"
            resValue "string", "loading_notebase", "Loading NoteBase…"
            resValue "string", "offline_message", "Please connect to the internet to load NoteBase for the first time. Once loaded, your notes and opened PDFs stay available offline."
            buildConfigField "String", "START_URL", "\"https://notebase-sigma.vercel.app\""
            buildConfigField "boolean", "IS_COORDINATOR", "false"
        }
        coordinator {
            dimension "portal"
            applicationId "com.notebase.coordinator"
            versionCode 1
            versionName "1.0.0"
            resValue "string", "app_name", "NoteBase Coordinator"
            resValue "string", "loading_notebase", "Loading Coordinator Portal…"
            resValue "string", "offline_message", "Please connect to the internet to open NoteBase Coordinator Portal and manage branch notes & PYQs."
            buildConfigField "String", "START_URL", "\"https://notebase-sigma.vercel.app/coordinator\""
            buildConfigField "boolean", "IS_COORDINATOR", "true"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
